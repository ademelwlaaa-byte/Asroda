name: Build Signed Release APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "GitHub Release oluştur ve APK ekle"
        type: boolean
        default: false
      release_tag:
        description: "Release etiketi (boş bırakılırsa build.gradle.kts versionName kullanılır, örn. v3.1)"
        type: string
        required: false
      version_code_override:
        description: "İsteğe bağlı yüksek versionCode değeri (boş bırakılırsa build.gradle.kts kullanılır)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK Licenses & Ensure SDK 36.1
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Setup Gradle (Cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper Executable & Required Jars
        run: |
          chmod +x ./gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: gradle/wrapper/gradle-wrapper.jar missing!"
            exit 1
          fi
          if [ ! -f app/libs/precompiled_missing.jar ]; then
            echo "ERROR: app/libs/precompiled_missing.jar missing!"
            exit 1
          fi

      - name: Prepare Safe .env File
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          else
            echo "GEMINI_API_KEY=RUNTIME_CONFIGURED_IN_APP_SETTINGS" > .env
          fi
          if [ ! -f .env.example ]; then
            echo "GEMINI_API_KEY=YOUR_API_KEY_HERE" > .env.example
          fi

      - name: Decode Release Keystore from Encrypted Secrets
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required signing secrets (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD)!"
            exit 1
          fi
          KS_PATH="$RUNNER_TEMP/asroda-release.keystore"
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KS_PATH"
          echo "KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          echo "Release keystore decoded cleanly to runner temp storage."

      - name: Extract App Version Metadata
        id: version
        run: |
          VER_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          VER_CODE=$(grep -oP '(?:baseVersionCode|versionCode)\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n 1)
          VER_NAME="${VER_NAME:-1.0}"
          VER_CODE="${VER_CODE:-1}"
          echo "version_name=$VER_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VER_CODE" >> "$GITHUB_OUTPUT"
          echo "Detected Asroda v${VER_NAME} (versionCode=${VER_CODE})"

      - name: Verify Resource Integrity (PNG/WebP Headers & Zero Corruption)
        run: |
          python3 - <<'PY'
          import os, sys
          res_root = "app/src/main/res"
          checked = 0
          for root, _, files in os.walk(res_root):
              for fn in files:
                  lower = fn.lower()
                  if not (lower.endswith(".png") or lower.endswith(".webp")):
                      continue
                  path = os.path.join(root, fn)
                  data = open(path, "rb").read()
                  if b"\xef\xbf\xbd" in data:
                      print(f"::error::Corrupted UTF-8 bytes (EF BF BD) found in {path}")
                      sys.exit(1)
                  if lower.endswith(".png") and not data.startswith(b"\x89PNG\r\n\x1a\n"):
                      print(f"::error::Invalid PNG header in {path}")
                      sys.exit(1)
                  if lower.endswith(".webp") and not (len(data) >= 12 and data[:4] == b"RIFF" and data[8:12] == b"WEBP"):
                      print(f"::error::Invalid WebP header in {path}")
                      sys.exit(1)
                  checked += 1
          print(f"Resource integrity verified cleanly across {checked} PNG/WebP assets.")
          PY

      - name: Run Mandatory Unit & Regression Tests (CI Quality Gate)
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload JUnit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Build R8-Optimized Signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE_OVERRIDE: ${{ inputs.version_code_override }}
        run: |
          EXTRA_ARGS="-PrequireReleaseKeystore=true"
          if [ -n "$VERSION_CODE_OVERRIDE" ]; then
            EXTRA_ARGS="$EXTRA_ARGS -PversionCodeOverride=$VERSION_CODE_OVERRIDE"
          fi
          ./gradlew :app:assembleRelease $EXTRA_ARGS --no-daemon --stacktrace

      - name: Verify APK Signature (V1 + V2 + V3 + Cert SHA-256) & Prepare Output Name
        id: apk
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 || vars.EXPECTED_CERT_SHA256 }}
        run: |
          SRC_APK="app/build/outputs/apk/release/app-release.apk"
          OUT_NAME="Asroda-v${{ steps.version.outputs.version_name }}-release.apk"
          OUT_DIR="$RUNNER_TEMP/release-output"
          mkdir -p "$OUT_DIR"
          cp "$SRC_APK" "$OUT_DIR/$OUT_NAME"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"

          VERIFY_OUT=$("$APKSIGNER" verify --min-sdk-version 21 --verbose --print-certs "$OUT_DIR/$OUT_NAME")
          echo "$VERIFY_OUT"

          echo "$VERIFY_OUT" | grep -q "Verified using v1 scheme (JAR signing): true" || { echo "::error::V1 signature missing!"; exit 1; }
          echo "$VERIFY_OUT" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" || { echo "::error::V2 signature missing!"; exit 1; }
          echo "$VERIFY_OUT" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" || { echo "::error::V3 signature missing!"; exit 1; }

          CERT_SHA256=$(echo "$VERIFY_OUT" | grep -m1 "Signer #1 certificate SHA-256 digest:" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]' | tr -d ':')
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Could not extract signer certificate SHA-256 digest!"
            exit 1
          fi
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            NORM_EXPECTED=$(echo "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ': ')
            if [ "$CERT_SHA256" != "$NORM_EXPECTED" ]; then
              echo "::error::Certificate SHA-256 mismatch! Expected=$NORM_EXPECTED Actual=$CERT_SHA256"
              exit 1
            fi
            echo "Certificate SHA-256 matched EXPECTED_CERT_SHA256 cleanly."
          fi

          BADGING=$("$AAPT2" dump badging "$OUT_DIR/$OUT_NAME" | head -n 1)
          APK_VER_CODE=$(echo "$BADGING" | grep -oP "versionCode='\K[^']+" || echo "${{ steps.version.outputs.version_code }}")
          APK_VER_NAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']+" || echo "${{ steps.version.outputs.version_name }}")
          APK_SHA256=$(sha256sum "$OUT_DIR/$OUT_NAME" | awk '{print $1}')
          APK_SIZE=$(du -h "$OUT_DIR/$OUT_NAME" | cut -f1)

          echo "apk_path=$OUT_DIR/$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "Signed Release APK Ready: $OUT_NAME ($APK_SIZE, versionCode=$APK_VER_CODE)"

          {
            echo "## Signed Release APK Verification"
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| **APK File** | \`$OUT_NAME\` ($APK_SIZE) |"
            echo "| **versionName / versionCode** | \`$APK_VER_NAME\` / \`$APK_VER_CODE\` |"
            echo "| **Signing Schemes** | V1: ✅ · V2: ✅ · V3: ✅ |"
            echo "| **Signer Cert SHA-256** | \`$CERT_SHA256\` |"
            echo "| **APK File SHA-256** | \`$APK_SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean Up Temporary Keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asroda-release.keystore"

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release (on v* tag or manual Release toggle)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v${{ steps.version.outputs.version_name }}"
          fi

          TITLE="Asroda ${TAG} (versionCode ${{ steps.version.outputs.version_code }})"
          NOTES="İmzalı & R8 optimize edilmiş **Asroda ${TAG}** Release APK (${{ steps.apk.outputs.apk_size }}).\n\n- **Uygulama Kimliği:** \`com.aistudio.emochi.uczaob\`\n- **İmza:** V1 + V2 + V3 Release Keystore (\`Asroda Studio\`)\n- Önceki imzalı sürümlerin üzerine kayıtlar silinmeden doğrudan kurulabilir."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.apk_path }}" --clobber
          else
            gh release create "$TAG" "${{ steps.apk.outputs.apk_path }}" \
              --title "$TITLE" \
              --notes "$(printf '%b' "$NOTES")" \
              --latest
          fi
